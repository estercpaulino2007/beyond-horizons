# Local development stack: PostgreSQL + API + web UI.
# Every variable has a default, so `docker compose up --build` works without a .env file.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beyond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beyond_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-beyond_horizons}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beyond} -d ${POSTGRES_DB:-beyond_horizons}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beyond}:${POSTGRES_PASSWORD:-beyond_local_only}@db:5432/${POSTGRES_DB:-beyond_horizons}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
