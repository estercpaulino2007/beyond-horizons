# Publishes the 3D Health HUD (frontend/public/hud3d) to this repository's own GitHub Pages site:
# https://estercpaulino2007.github.io/beyond-horizons/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy HUD to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/public/hud3d/**"
      - ".github/workflows/hud-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public/hud3d
      - id: deployment
        uses: actions/deploy-pages@v4
